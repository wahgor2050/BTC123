name: Test Telegram (one-off)
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat = os.environ["TELEGRAM_CHAT_ID"]
          print("token length:", len(token), "  chat_id repr:", repr(chat))
          payload = urllib.parse.urlencode({
              "chat_id": chat,
              "text": "BTC123 test message -- if you see this, the bot + chat ID are wired correctly.",
          }).encode()
          req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=payload)
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  body = json.loads(r.read())
              print("RESULT ok=%s body=%s" % (body.get("ok"), body))
          except urllib.error.HTTPError as e:
              detail = e.read().decode(errors="replace")
              print("HTTP", e.code, "BODY:", detail)
          # also check getMe to confirm token identity (bot username), no secret leak
          try:
              with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/getMe", timeout=15) as r:
                  me = json.loads(r.read())
              print("getMe:", me.get("result", {}).get("username"))
          except Exception as e:
              print("getMe failed:", e)
          PY
